[package]
name = "clipdate"
version = "0.1.4"
edition = "2024"
description = "CLI tool updater"
authors = ["Noob Lol"]
license = "MIT"
publish = false
repository = "https://github.com/Noob-Lol/clipdate"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
semver = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
indicatif = "0.18"
console = "0.16"
tar = "0.4"
flate2 = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true

[build-dependencies]
winresource = "0.1"
