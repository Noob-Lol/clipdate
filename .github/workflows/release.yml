name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to simulate (e.g. v1.2.3) — for dry-run testing only"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: clipdate

jobs:
  build:
    name: build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native
          - target: x86_64-unknown-linux-gnu
            platform_name: linux_amd64
            runner: ubuntu-latest
            archive_ext: tar.gz

          # Linux aarch64 — native but arm
          - target: aarch64-unknown-linux-gnu
            platform_name: linux_arm64
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz

          # macOS x86_64 — native
          - target: x86_64-apple-darwin
            platform_name: darwin_amd64
            runner: macos-latest
            archive_ext: tar.gz

          # macOS Apple Silicon — native on macos-latest (M1 runners)
          - target: aarch64-apple-darwin
            platform_name: darwin_arm64
            runner: macos-latest
            archive_ext: tar.gz

          # Windows x86_64 — native
          - target: x86_64-pc-windows-msvc
            platform_name: windows_amd64
            runner: windows-latest
            archive_ext: zip

          # Windows aarch64 — cross-compile on windows runner
          - target: aarch64-pc-windows-msvc
            platform_name: windows_arm64
            runner: windows-latest
            archive_ext: zip

    steps:
      - uses: actions/checkout@v7

      - name: Verify Cargo.toml version matches tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/".*//')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "✅ Version $CARGO_VERSION matches tag $GITHUB_REF_NAME"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ---------- package ----------

      - name: Package
        id: package
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          EXT="${{ matrix.archive_ext }}"
          ARCHIVE="${BINARY_NAME}_${VERSION}_${{ matrix.platform_name }}.${EXT}"

          # binary has .exe on Windows
          BINARY="target/${{ matrix.target }}/release/${BINARY_NAME}"
          [ "$EXT" = "zip" ] && BINARY="${BINARY}.exe"

          # include binary + metadata files (skip missing ones gracefully)
          FILES=("$BINARY")
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && FILES+=("$f")
          done

          if [ "$EXT" = "tar.gz" ]; then
            tar -czf "$ARCHIVE" "${FILES[@]}"
          else
            7z a "$ARCHIVE" "${FILES[@]}" > /dev/null
          fi

          echo "asset=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS  # print to log for easy verification

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v1.0.0-beta → prerelease